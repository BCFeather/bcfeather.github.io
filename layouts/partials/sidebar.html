<aside aria-label="Sidebar" id="sidebar" class="d-flex flex-column align-items-end">
  <header class="profile-wrapper">
    <a href="/" id="avatar" class="rounded-circle">
      {{- if site.Params.social }}
      {{- end }}
      <img src="https://github.com/{{ site.Params.github }}.png" width="112" height="112" alt="avatar" onerror="this.style.display='none'">
    </a>
    <a class="site-title d-block" href="/">{{ site.Title }}</a>
    <p class="site-subtitle fst-italic mb-0">{{ site.Params.tagline }}</p>
  </header>
  <nav class="flex-column flex-grow-1 w-100 ps-0">
    <ul class="nav">
      <li class="nav-item">
        <a href="/" class="nav-link"><i class="fa-fw fas fa-home"></i><span>HOME</span></a>
      </li>
      {{ $u := .RelPermalink }}
      <li class="nav-item{{ if eq $u "/categories/" }} active{{ end }}">
        <a href="/categories/" class="nav-link"><i class="fa-fw fas fa-stream"></i><span>CATEGORIES</span></a>
      </li>
      <li class="nav-item{{ if or (eq $u "/archives/") (hasPrefix $u "/archives/") }} active{{ end }}">
        <a href="/archives/" class="nav-link"><i class="fa-fw fas fa-archive"></i><span>ARCHIVES</span></a>
      </li>
      <li class="nav-item{{ if eq $u "/about/" }} active{{ end }}">
        <a href="/about/" class="nav-link"><i class="fa-fw fas fa-info-circle"></i><span>ABOUT</span></a>
      </li>
      <li class="nav-item{{ if eq $u "/faq/" }} active{{ end }}">
        <a href="/faq/" class="nav-link"><i class="fa-fw fas fa-circle-question"></i><span>FAQ</span></a>
      </li>
    </ul>
  </nav>
  <div class="sidebar-bottom d-flex flex-wrap align-items-center w-100">
    <div class="btn-group dropup">
      <button type="button" class="btn btn-link nav-link" aria-label="Switch Mode" id="mode-toggle" data-bs-toggle="dropdown">
        <i class="fa-regular fa-sun" data-theme-mode="light"></i><i class="fa-regular fa-moon" data-theme-mode="dark"></i><i class="fa-solid fa-display" data-theme-mode="system"></i>
      </button>
      <ul class="dropdown-menu rounded-3 mb-1 p-1">
        <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="light"><i class="fa-regular fa-sun" data-theme-mode="light"></i>Light</button></li>
        <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="dark"><i class="fa-regular fa-moon" data-theme-mode="dark"></i>Dark</button></li>
        <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-mode="system"><i class="fa-solid fa-display" data-theme-mode="system"></i>System</button></li>
      </ul>
    </div>
    <span class="icon-border"></span>
    <a href="https://github.com/{{ site.Params.github }}" aria-label="github" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>
    <a href="https://twitter.com/{{ site.Params.twitter }}" aria-label="twitter" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
    <a href="javascript:void(location.href = 'mailto:' + ['baocz2008','outlook.com'].join('@'))" aria-label="email"><i class="fas fa-envelope"></i></a>
    <a href="/feed.xml" aria-label="rss"><i class="fas fa-rss"></i></a>
  </div>
</aside>
