{{ define "main" }}
<article class="px-1">
  <header><h1 data-toc-skip>{{ .Title }}</h1></header>
  <div class="content">
    <ul class="content ps-0">
      {{ range .Pages.ByDate.Reverse }}
      <li class="d-flex justify-content-between px-md-3">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="dash flex-grow-1"></span>
        <time class="text-muted small text-nowrap">{{ .Date.Format "2 Jan 2006" }}</time>
      </li>
      {{ end }}
    </ul>
  </div>
</article>
{{ end }}
