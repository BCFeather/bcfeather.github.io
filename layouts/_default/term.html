{{ define "main" }}
{{ $isCat := eq .Data.Singular "category" }}
<div id="page-{{ .Data.Singular }}">
  <h1 class="ps-lg-2">
    <i class="{{ if $isCat }}far fa-folder-open{{ else }}fa fa-tag{{ end }} fa-fw text-muted"></i>
    {{ .Data.Term }}
    <span class="lead text-muted ps-2">{{ len .Pages }}</span>
  </h1>
  <ul class="content ps-0">
    {{ range .Pages.ByDate.Reverse }}
    <li class="d-flex justify-content-between px-md-3">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="dash flex-grow-1"></span>
      <time class="text-muted small text-nowrap" data-ts="{{ .Date.Unix }}" data-df="D MMM YYYY">{{ .Date.Format "2 Jan 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
