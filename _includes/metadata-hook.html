<style>
  /* Mobile: once the auto-hiding top bar is out of view, the theme's own sidebar
     trigger reappears as a compact chip, so the drawer stays one tap away. */
  @media all and (max-width: 849px){
    #sidebar-trigger.nav-float{
      position: fixed !important;
      top: .5rem;
      left: .5rem;
      z-index: 1055;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      border-radius: 50%;
      background: var(--main-bg, #fff);
      border: 1px solid var(--main-border-color, #e9ecef);
      box-shadow: 0 1px 6px rgba(0, 0, 0, .12);
    }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var trigger = document.getElementById('sidebar-trigger');
    if (!trigger) { return; }
    function update() {
      var show = window.innerWidth < 850 && window.scrollY > 64;
      trigger.classList.toggle('nav-float', show);
    }
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
  });
</script>
